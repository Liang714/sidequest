packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  # @sentry/cli's postinstall downloads a binary used for source-map
  # upload / release tracking — not needed here since apps/web's Sentry
  # integration deliberately skips the next.config.ts webpack wrapper
  # (see instrumentation.ts's docstring), so there's nothing for it to do.
  '@sentry/cli': false
  sharp: true
  unrs-resolver: true

# Native post-install build scripts pnpm otherwise blocks by default.
# sharp: Next.js's image optimizer (official, widely used native binary).
# unrs-resolver: native resolver used by eslint-config-next's import
# resolution. Both are well-known, standard toolchain dependencies.
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
