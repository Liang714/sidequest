name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sidequest
          POSTGRES_PASSWORD: sidequest
          POSTGRES_DB: sidequest
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://sidequest:sidequest@localhost:5432/sidequest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        # No python-version input here — services/api/.python-version (3.13)
        # already pins it, uv reads that automatically.

      - run: uv sync --all-extras --dev

      # conftest.py connects to a separate sidequest_test DB (see its
      # docstring) — the schema itself is created by the test fixtures,
      # but the database has to exist first.
      - name: Create test database
        run: PGPASSWORD=sidequest psql -h localhost -U sidequest -d sidequest -c "CREATE DATABASE sidequest_test;"

      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json's "packageManager" field

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Root-level turbo tasks — scoped to whichever workspace packages
      # actually define each script (apps/web today; apps/mobile is still
      # a README stub with no scripts, turbo skips it, not an error).
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
